name: Release

# Push a tag like v1.2.0 (or v1.3.0-beta.1) to build a signed APK and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. See RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nyumbani.jks"
          echo "NYUMBANI_KEYSTORE_FILE=$RUNNER_TEMP/nyumbani.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          NYUMBANI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NYUMBANI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NYUMBANI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Check it isn't debug-signed
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          if grep -q "CN=Android Debug" <<< "$certs"; then
            echo "::error::The APK is signed with the debug key; check the KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets."
            exit 1
          fi

      - name: Name the APK and write checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/nyumbani-$VERSION.apk"
          cp "dist/nyumbani-$VERSION.apk" dist/nyumbani.apk
          (cd dist && sha256sum "nyumbani-$VERSION.apk" nyumbani.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/nyumbani-${{ steps.version.outputs.version }}.apk
            dist/nyumbani.apk
            dist/SHA256SUMS.txt

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nyumbani.jks"
