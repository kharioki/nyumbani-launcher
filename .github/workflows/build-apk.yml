name: Build APK

# Every push to a branch and every pull request: build the APK and keep it as a workflow
# artifact. No release keys here, so it's debug-signed. Tags are handled by release.yml.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so the version name follows the latest release (git describe).
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: nyumbani-launcher
          path: app/build/outputs/apk/release/app-release.apk
